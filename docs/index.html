<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ida Villadsen Portfolio</title>

    <!-- apply the saved theme before first paint, otherwise the default
         theme flashes for a frame before react mounts -->
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("theme") || "mono";
      } catch (e) {
        document.documentElement.dataset.theme = "mono";
      }
    </script>

    <!-- external assets (fine to keep absolute) -->
    <!-- integrity pins the exact file: if the cdn ever serves something else,
         the browser refuses to run it. bumping the version means a new hash.
         held at 1.8.0 on purpose: newer p5 (seen in 1.11) wraps a font list
         containing spaces in quotes, the canvas rejects it, and the sketches'
         FONT_STACK / CUBE_FONT fall back to 12px — the 3d name breaks up -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.8.0/p5.js"
            integrity="sha384-UGaPYECMaSWw6KZ2g2vFfj8T+W+Ywb5paiXQ8zLxHF2+Y6lRd5ppoyGjkfbkimAv"
            crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aladin&family=Bungee+Spice&family=Bytesized&family=Faculty+Glyphic&family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&family=Inria+Serif:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Koulen&family=Noto+Serif:ital,wght@0,100..900;1,100..900&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Slab:wght@100&display=swap" rel="stylesheet">
    <meta charset="UTF-8" />

    <!-- favicon (use vite's built-in handling) -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <script type="module" crossorigin src="/work/assets/index-Cxg55oTl.js"></script>
    <link rel="stylesheet" crossorigin href="/work/assets/index-S9kjzfdR.css">
  </head>
