<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ida Villadsen Portfolio</title>

    <!-- the site's theme, set before first paint so nothing flashes.
         DEFAULT_THEME is THE switch: "paper" (light, the name as the 3d face)
         or "mono" (black & white, the dark one). the rest live in index.css.

         the saved theme is ignored on purpose while <ThemeToggle /> is hidden
         in App.tsx: visitors can't change it, so a theme a browser saved
         earlier would stick with no way out — and localhost keeps its own
         saved theme, which is how dev and the live site ended up different.
         bring the toggle back and uncomment the try/catch to honour it.

         wrapped in { } so these names stay out of the global scope the
         sketch scripts share. -->
    <script>
      {
        const DEFAULT_THEME = "paper";
        let theme = DEFAULT_THEME;
        // try { theme = localStorage.getItem("theme") || DEFAULT_THEME; }
        // catch (e) {}
        document.documentElement.dataset.theme = theme;
      }
    </script>

    <!-- external assets (fine to keep absolute) -->
    <!-- integrity pins the exact file: if the cdn ever serves something else,
         the browser refuses to run it. bumping the version means a new hash.
         held at 1.8.0 on purpose: newer p5 (seen in 1.11) wraps a font list
         containing spaces in quotes, the canvas rejects it, and the sketches'
         FONT_STACK / CUBE_FONT fall back to 12px — the 3d name breaks up -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.8.0/p5.js"
            integrity="sha384-UGaPYECMaSWw6KZ2g2vFfj8T+W+Ywb5paiXQ8zLxHF2+Y6lRd5ppoyGjkfbkimAv"
            crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aladin&family=Bungee+Spice&family=Bytesized&family=Faculty+Glyphic&family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&family=Inria+Serif:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Koulen&family=Noto+Serif:ital,wght@0,100..900;1,100..900&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Slab:wght@100&display=swap" rel="stylesheet">
    <meta charset="UTF-8" />

    <!-- favicon (use vite's built-in handling) -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  </head>
  <body>
    <div id="pfive-container-background"></div>

    <!-- relative paths for local scripts -->
    <!-- particle background temporarily off — uncomment to bring it back -->
    <!-- <script src="./sketch/sketch.js"></script> -->
    <script src="./sketch/background_sketch.js"></script>
    <script src="./sketch/topSketch.js"></script>
    <script src="./sketch/cornerCube.js"></script>

    <div id="root"></div>

    <!-- vite will rewrite this properly in production -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
